<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — ShopProject</title>
  <meta name="description" content="Форма оформления заявки на товар или консультацию.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body id="top">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html" aria-current="page">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные товары</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page">
    <h1>Оформление заявки</h1>
    <section class="section section--narrow">
    <form class="order-form" id="order-form" action="#" method="post" novalidate>
      <div class="order-form__field">
        <label class="order-form__label" for="order-product">Товар</label>
        <select class="order-form__input" id="order-product" name="product">
          <option value="">Не выбран</option>
          <option>Товар 1</option><option>Товар 2</option><option>Товар 3</option>
        </select>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-name">Имя</label>
        <input class="order-form__input" id="order-name" name="name" type="text" placeholder="Введите ваше имя" minlength="2" autocomplete="given-name" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-email">E-mail</label>
        <input class="order-form__input" id="order-email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-phone">Телефон</label>
        <input class="order-form__input" id="order-phone" name="phone" type="tel" inputmode="tel" placeholder="+7 (900) 000-00-00" pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$" aria-describedby="phone-hint" required>
        <small class="order-form__hint" id="phone-hint">Формат: +7 (900) 000-00-00</small>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-date">Дата связи</label>
        <input class="order-form__input" id="order-date" name="date" type="date">
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-topic">Тема заявки</label>
        <select class="order-form__input" id="order-topic" name="topic" required>
          <option value="">Выберите тему</option>
          <option value="product">Заказ товара</option>
          <option value="consultation">Консультация</option>
          <option value="delivery">Доставка</option>
        </select>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="order-comment">Комментарий</label>
        <textarea class="order-form__input" id="order-comment" name="comment" rows="4" placeholder="Укажите дополнительную информацию"></textarea>
      </div>
      <div class="order-form__field order-form__field--checkbox">
        <label class="order-form__label" for="order-agreement">
          <input id="order-agreement" name="agreement" type="checkbox" required>
          Я согласен на обработку данных
        </label>
      </div>
      <div class="order-form__actions">
        <button class="button" type="submit">Отправить заявку</button>
      </div>
    </form>
    <p class="success-message" id="success-message" role="status" hidden>Форма успешно отправлена!</p>
    </section>
  </main>

  <footer class="site-footer" id="contacts">
    <div class="site-footer__inner">
      <p>&copy; 2026 Учебный проект. Все права защищены.</p>
      <p>Дисциплина: Фронтенд и бэкенд разработка</p>
      <p><a class="site-footer__link" href="contacts.html">Контакты</a> · <a class="site-footer__link" href="order.html">Оставить заявку</a></p>
    </div>
  </footer>

  <a class="back-to-top" href="#top" aria-label="Наверх">↑</a>
</body>
</html>
